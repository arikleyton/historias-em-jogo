<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrimento do Brasil - Tela Inicial</title>
    <!-- Fontes para estilo HQ / Histórico -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fundo 100% branco */
            background-color: #ffffff;
            color: #1a0f0a;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* =========================================
           CONTAINER PRINCIPAL
           ========================================= */
        .comic-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            max-height: 85vh;
            aspect-ratio: 16 / 9;
            border: 6px solid #1a0f0a;            
            overflow: hidden;            
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            
            /* Background ajustado com img01.png e tamanho 70% */
            background-image: url('img01.png');
            background-position: bottom left;
            background-repeat: no-repeat;
            background-size: 70%;
            background-color: #ffffff;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* Alinha o conteúdo principal à direita */
            padding: 30px 50px;
            user-select: none;
        }

        /* =========================================
           ÁREA DIREITA: TÍTULO & BOTÕES
           ========================================= */
        .right-content-wrapper {
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            max-width: 50%; /* Garante que fique na metade direita */
        }

        /* =========================================
           TÍTULO ANIMADO - HQ COMIC
           ========================================= */
        .title-wrapper {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .subtitle-badge {
            background-color: #ffb142;
            color: #1a0f0a;
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 4px 22px;
            border: 3.5px solid #1a0f0a;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #1a0f0a;
            margin-bottom: 10px;
            transform: rotate(-2deg);
        }

        .main-title {
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 3.8rem;
            text-transform: uppercase;
            line-height: 1.0;
            color: #ff5252;
            text-shadow: 
                4px 4px 0px #1a0f0a,
                -2px -2px 0px #1a0f0a,
                2px -2px 0px #1a0f0a,
                -2px 2px 0px #1a0f0a;
            letter-spacing: 3px;
            animation: floatTitle 3s ease-in-out infinite;
        }

        .main-title span {
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
            cursor: default;
        }

        .main-title span:hover {
            transform: scale(1.25) translateY(-5px) rotate(-6deg);
            color: #ffda79;
        }

        .highlight-word span {
            color: #10ac84;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        /* =========================================
           BOTÕES DE AÇÃO (INICIAR & CRÉDITOS)
           ========================================= */
        .actions-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-iniciar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #ff5252;
            color: #ffffff;
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-decoration: none;
            padding: 10px 48px;
            border: 4px solid #1a0f0a;
            border-radius: 50px;
            box-shadow: 0px 8px 0px #1a0f0a;
            cursor: pointer;
            transition: all 0.15s ease;
            animation: pulseBtn 2s infinite;
        }

        .btn-iniciar:hover {
            background-color: #ff7979;
            transform: translateY(-3px);
            box-shadow: 0px 11px 0px #1a0f0a;
        }

        .btn-iniciar:active {
            transform: translateY(5px);
            box-shadow: 0px 3px 0px #1a0f0a;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 18px solid #ffffff;
            filter: drop-shadow(2px 2px 0px #1a0f0a);
        }

        .btn-creditos {
            display: inline-block;
            background-color: #ffb142;
            color: #1a0f0a;
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            text-decoration: none;
            padding: 6px 24px;
            border: 3px solid #1a0f0a;
            border-radius: 20px;
            box-shadow: 3px 3px 0px #1a0f0a;
            transition: all 0.15s ease;
        }

        .btn-creditos:hover {
            background-color: #fca522;
            transform: scale(1.05);
            box-shadow: 4px 4px 0px #1a0f0a;
        }

        .btn-creditos:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1a0f0a;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* =========================================
           RODAPÉ ESQUERDO: LOGO2 & LOGO IFPA
           ========================================= */
        .footer-left-logos {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-principal-box img {
            max-height: 65px;
            width: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.25s ease;
        }

        .logo-principal-box img:hover {
            transform: scale(1.05) rotate(-1deg);
        }

        .footer-support {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-label {
            font-size: 0.75rem;
            font-weight: 900;
            color: #1a0f0a;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .logo-ifpa-box img {
            max-height: 42px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* =========================================
           RESPONSIVIDADE
           ========================================= */
        @media (max-width: 768px) {
            .comic-container {
                aspect-ratio: auto;
                min-height: 90vh;
                padding: 20px;
                align-items: center;
                background-size: 100%;
            }

            .right-content-wrapper {
                max-width: 100%;
            }

            .main-title {
                font-size: 2.5rem;
            }

            .btn-iniciar {
                font-size: 1.8rem;
                padding: 10px 36px;
            }

            .footer-left-logos {
                position: relative;
                bottom: auto;
                left: auto;
                margin-top: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="comic-container" id="comic-container">

        <!-- ÁREA À DIREITA COM TÍTULO E BOTÕES DE AÇÃO -->
        <div class="right-content-wrapper">
            <!-- TÍTULO ANIMADO -->
            <main class="title-wrapper">
                <div class="subtitle-badge">Uma Aventura em Quadrinhos!</div>
                <h1 class="main-title">
                    <span>D</span><span>E</span><span>S</span><span>C</span><span>O</span><span>B</span><span>R</span><span>I</span><span>M</span><span>E</span><span>N</span><span>T</span><span>O</span>
                    <br>
                    <span>D</span><span>O</span>
                    <span class="highlight-word">
                        <span>B</span><span>R</span><span>A</span><span>S</span><span>I</span><span>L</span>
                    </span>
                </h1>
            </main>

            <!-- BOTÕES DE AÇÃO -->
            <div class="actions-container">
                <a href="../01/cap01.html" class="btn-iniciar">
                    <span class="play-icon"></span>
                    INICIAR
                </a>
                <a href="../../creditos.html" class="btn-creditos">
                    📜 CRÉDITOS
                </a>
            </div>
        </div>

        <!-- NO CANTO INFERIOR ESQUERDO: LOGO2 + LOGO INSTITUCIONAL APOIADORA (IFPA) -->
        <div class="footer-left-logos">
            <div class="logo-principal-box">
                <img src="Logo2-removebg-preview.png" alt="Histórias em Jogo - Logo Principal">
            </div>
            
            <div class="footer-support">
                <span class="support-label">Apoio:</span>
                <div class="logo-ifpa-box">
                    <img src="LOGO_IFPA_PARAGOMINAS_2.png" alt="IFPA Campus Paragominas">
                </div>
            </div>
        </div>

    </div>

</body>
</html>
